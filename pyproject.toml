[project]
name = "recipe-database"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "rich>=13.0.0",
    "plotext>=5.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "black>=24.3.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]
