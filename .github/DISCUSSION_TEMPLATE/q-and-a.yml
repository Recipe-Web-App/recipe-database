---
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Ask questions about using the Recipe Database!

        Before asking, please check:
        - [README.md](../README.md)
        - [CLAUDE.md](../CLAUDE.md)
        - [SUPPORT.md](../.github/SUPPORT.md)
        - [Existing Discussions](https://github.com/Recipe-Web-App/recipe-database/discussions)

  - type: textarea
    attributes:
      label: Question
      description: What would you like to know?
      placeholder: Your question here...
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Topic Area
      description: What is your question about?
      options:
        - Database Schema
        - SQL Queries
        - Python Data Processing
        - Kubernetes Deployment
        - Configuration
        - Monitoring/Observability
        - Performance
        - Troubleshooting
        - Development
        - Security
        - Backup/Recovery
        - Other

  - type: textarea
    attributes:
      label: Context
      description: Provide relevant context
      placeholder: |
        What are you trying to accomplish?
        What have you tried so far?
        Environment details (PostgreSQL version, K8s version, etc.)

  - type: textarea
    attributes:
      label: Relevant Configuration or Code
      description: Share relevant SQL, config, or code (redact secrets!)
      render: sql
      placeholder: |
        SQL queries, environment variables, K8s manifests, etc.
